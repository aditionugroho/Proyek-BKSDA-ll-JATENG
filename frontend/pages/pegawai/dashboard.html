<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Saya - E-Office SKSDA</title>

  <!-- ===== Stylesheet (path relatif dari pages/pegawai/) ===== -->
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <link rel="stylesheet" href="../../assets/css/layout-pg.css" />
  <link rel="stylesheet" href="../../assets/css/pages/pg-dashboard.css" />
</head>
<body>

  <!-- ===== Layout bersama (dirender via JS) ===== -->
  <aside id="pg-sidebar"></aside>
  <header id="pg-navbar"></header>

  <!-- ===== Konten halaman ===== -->
  <main class="main-content">

    <!-- ===== RUNNING TEXT (PENGUMUMAN) ===== -->
    <section id="running-text-bar" class="running-text-bar">
      <div class="running-text-label">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8v18L3 13v-2z"></path><line x1="11.6" y1="16.8" x2="15" y2="18.4"></line><line x1="11.6" y1="16.8" x2="11.6" y2="11.2"></line></svg>
        PENGUMUMAN
      </div>
      <div class="running-text-viewport">
        <div id="running-text-track" class="running-text-track"></div>
      </div>
    </section>

    <!-- ===== 1. HEADER ===== -->
    <section class="pgd-head">
      <div>
        <h1 class="pgd-title">Dashboard Saya</h1>
        <p class="pgd-desc">Kelola tugas, disposisi, dan pekerjaan Anda.</p>
      </div>
    </section>

    <!-- ===== 2. STAT CARD (render via JS) ===== -->
    <section class="pgd-stats" id="pgd-stats" aria-label="Ringkasan pekerjaan"></section>

    <!-- ===== 3. GRID DUA KOLOM ===== -->
    <section class="pgd-grid">

      <!-- KIRI: prioritas hari ini -->
      <div class="pgd-card">
        <div class="pgd-card-head">
          <div class="pgd-card-head-left">
            <span class="pgd-card-icon pgd-card-icon--red">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            </span>
            <h2 class="pgd-card-title">Prioritas Hari Ini</h2>
          </div>
          <a href="tugas-saya.html" class="pgd-link">Lihat Semua</a>
        </div>
        <div class="pgd-priority-list" id="pgd-priority"></div>
      </div>

      <!-- KANAN: disposisi terbaru -->
      <div class="pgd-card">
        <div class="pgd-card-head">
          <div class="pgd-card-head-left">
            <span class="pgd-card-icon pgd-card-icon--blue">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </span>
            <h2 class="pgd-card-title">Disposisi Terbaru</h2>
          </div>
        </div>
        <div id="pgd-disposisi"></div>
        <a href="disposisi-saya.html" class="pgd-inbox-link">Lihat Kotak Masuk</a>
      </div>

    </section>

  </main>

  <!-- ===== Footer ===== -->
  <footer class="pg-footer">
    &copy; 2026 e-Office SKSDA Jawa Tengah. All rights reserved.
  </footer>

  <!-- ===== Skrip ===== -->
  <script type="module" src="../../assets/js/auth.js"></script>
  <script type="module" src="../../assets/js/components/sidebar-pg.js"></script>
  <script type="module" src="../../assets/js/components/navbar-pg.js"></script>
  <script type="module" src="../../assets/js/pages/pg-dashboard.js"></script>
</body>
</html>
