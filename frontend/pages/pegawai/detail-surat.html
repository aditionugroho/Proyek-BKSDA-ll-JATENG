<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Surat - E-Office SKSDA</title>

  <!-- ===== Stylesheet ===== -->
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <link rel="stylesheet" href="../../assets/css/layout-pg.css" />
  <link rel="stylesheet" href="../../assets/css/pages/detail-generic.css" />
</head>
<body>

  <!-- ===== Layout bersama ===== -->
  <aside id="pg-sidebar"></aside>
  <header id="pg-navbar"></header>

  <!-- ===== Konten ===== -->
  <main class="main-content">

    <!-- Breadcrumb 3-level -->
    <nav class="dg-breadcrumb" aria-label="Breadcrumb">
      <a href="dashboard.html">Dashboard</a>
      <span class="dg-breadcrumb-sep">&gt;</span>
      <a href="surat.html">Surat</a>
      <span class="dg-breadcrumb-sep">&gt;</span>
      <span class="dg-breadcrumb-current" id="dg-crumb">Detail Surat</span>
    </nav>

    <!-- Tombol kembali eksplisit -->
    <a href="surat.html" class="dg-back">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Kembali ke Daftar Surat
    </a>

    <!-- Kartu detail -->
    <section class="dg-card">
      <div class="dg-title-row">
        <div>
          <h1 class="dg-title" id="dg-title">Memuat...</h1>
          <p class="dg-sub" id="dg-sub"></p>
        </div>
        <span class="dg-badge" id="dg-badge"></span>
      </div>
      <div class="dg-grid" id="dg-info"></div>
    </section>

  </main>

  <footer class="pg-footer">&copy; 2026 e-Office SKSDA Jawa Tengah. All rights reserved.</footer>

  <!-- ===== Skrip ===== -->
  <script src="../../assets/js/api.js"></script>
  <script type="module" src="../../assets/js/auth.js"></script>
  <script type="module" src="../../assets/js/components/sidebar-pg.js"></script>
  <script type="module" src="../../assets/js/components/navbar-pg.js"></script>
  <script type="module">
    import { suratPgData as MOCK } from "../../assets/js/data/surat-pegawai.js";

    async function loadDetail(id) {
      if (window.EOfficeAPI && EOfficeAPI.config.LIVE) {
        return EOfficeAPI.getSuratSayaDetail(id);
      }
      return MOCK.find((x) => x.id === id) || MOCK[0];
    }

    async function init() {
      const id = Number(new URLSearchParams(location.search).get("id"));
      let d;
      try {
        d = await loadDetail(id);
      } catch (e) {
        document.getElementById("dg-title").textContent = "Gagal memuat detail surat";
        return;
      }

      const TONE = { red: "red", gray: "gray", blue: "blue", green: "green", amber: "gray" };

      document.getElementById("dg-crumb").textContent = d.nomor;
      document.getElementById("dg-title").textContent = d.perihal;
      document.getElementById("dg-sub").textContent = `${d.pengirim} \u2022 ${d.tanggal}, ${d.waktu}`;
      const badge = document.getElementById("dg-badge");
      badge.textContent = d.label.text;
      badge.className = `dg-badge dg-badge--${TONE[d.label.tone] || "gray"}`;

      const rows = [
        ["Nomor Surat", d.nomor, true],
        ["Pengirim", d.pengirim],
        ["Tanggal Surat", `${d.tanggal} \u2022 ${d.waktu}`],
        ["Sifat", d.sifat],
        ["Status", d.status],
        ["Jenis", d.jenis.charAt(0).toUpperCase() + d.jenis.slice(1)]
      ];

      document.getElementById("dg-info").innerHTML = rows
        .map(([l, v, mono]) => `
          <div class="dg-field">
            <p class="dg-label">${l}</p>
            <p class="dg-value${mono ? " dg-value--mono" : ""}">${v}</p>
          </div>`)
        .join("");

      document.title = `${d.perihal} - E-Office SKSDA`;
    }

    init();
  </script>
</body>
</html>
