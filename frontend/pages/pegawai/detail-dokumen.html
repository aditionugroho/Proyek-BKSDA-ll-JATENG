<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#2563EB" />
  <link rel="apple-touch-icon" href="/assets/js/images/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="E-Office SKSDA" />
  <title>Detail Dokumen - E-Office SKSDA</title>

  <!-- ===== Stylesheet ===== -->
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <link rel="stylesheet" href="../../assets/css/layout-pg.css" />
  <link rel="stylesheet" href="../../assets/css/pages/detail-generic.css" />
</head>
<body>

  <!-- ===== Layout bersama ===== -->
  <aside id="pg-sidebar"></aside>
  <header id="pg-navbar"></header>

  <!-- ===== Konten ===== -->
  <main class="main-content">

    <nav class="dg-breadcrumb" aria-label="Breadcrumb">
      <a href="dashboard.html">Dashboard</a>
      <span class="dg-breadcrumb-sep">&gt;</span>
      <a href="dokumen-saya.html">Dokumen Saya</a>
      <span class="dg-breadcrumb-sep">&gt;</span>
      <span class="dg-breadcrumb-current" id="dg-crumb">Detail Dokumen</span>
    </nav>

    <a href="dokumen-saya.html" class="dg-back">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Kembali ke Dokumen Saya
    </a>

    <section class="dg-card">
      <div class="dg-title-row">
        <div>
          <h1 class="dg-title" id="dg-title">Memuat...</h1>
          <p class="dg-sub" id="dg-sub"></p>
        </div>
        <span class="dg-badge" id="dg-badge"></span>
      </div>
      <div class="dg-grid" id="dg-info"></div>
    </section>

  </main>

  <footer class="pg-footer">&copy; 2026 e-Office SKSDA Jawa Tengah. All rights reserved.</footer>

  <!-- ===== Skrip ===== -->
  <script src="../../assets/js/api.js"></script>
  <script type="module" src="../../assets/js/auth.js"></script>
  <script type="module" src="../../assets/js/components/sidebar-pg.js"></script>
  <script type="module" src="../../assets/js/components/navbar-pg.js"></script>
  <script type="module">
    import { downloadDraftAttachment } from "../../assets/js/pages/surat-keluar-draft.js";

    async function init() {
      const id = Number(new URLSearchParams(location.search).get("id"));
      const title = document.getElementById("dg-title");
      const subtitle = document.getElementById("dg-sub");
      try {
        if (!Number.isSafeInteger(id) || id < 1) throw new Error("ID dokumen tidak valid.");
        const response = await window.EOfficeAPI.getDokumenSayaDetail(id);
        const data = response?.data;
        if (response?.status !== true || Number(data?.id) !== id) {
          throw new Error(response?.message || "Format detail dokumen tidak valid.");
        }

        const name = data.perihal || "Tanpa perihal";
        document.getElementById("dg-crumb").textContent = name;
        title.textContent = name;
        subtitle.textContent = data.klasifikasi || "Surat Keluar";
        const badge = document.getElementById("dg-badge");
        badge.textContent = data.status;
        badge.className = `dg-badge dg-badge--${data.status === "Diajukan" ? "blue" : "gray"}`;

        const rows = [
          ["Nomor Surat", data.no_surat],
          ["Nomor Agenda", data.no_agenda],
          ["Tanggal", data.tanggal],
          ["Tujuan", data.tujuan],
          ["Isi", data.isi],
        ];
        const info = document.getElementById("dg-info");
        info.replaceChildren(...rows.map(([label, value]) => {
          const field = document.createElement("div");
          field.className = "dg-field";
          const heading = document.createElement("p");
          heading.className = "dg-label";
          heading.textContent = label;
          const content = document.createElement("p");
          content.className = "dg-value";
          content.style.whiteSpace = "pre-wrap";
          content.textContent = value || "?";
          field.append(heading, content);
          return field;
        }));
        if (data.status === "Draft") {
          const edit = document.createElement("a");
          edit.href = `buat-surat.html?draft_id=${id}`;
          edit.className = "dg-back";
          edit.textContent = "Edit Draft";
          info.after(edit);
        }
        if (data.file_path) {
          const download = document.createElement("button");
          download.type = "button";
          download.textContent = "Unduh lampiran";
          download.addEventListener("click", async () => {
            download.disabled = true;
            try {
              await downloadDraftAttachment(id);
            } catch (error) {
              subtitle.textContent = error.message;
            } finally {
              download.disabled = false;
            }
          });
          info.after(download);
        }
        document.title = `${name} - E-Office SKSDA`;
      } catch (error) {
        title.textContent = "Gagal memuat detail dokumen";
        subtitle.textContent = error.message;
      }
    }

    init();
  </script>
  <script src="/sw-register.js"></script>
</body>
</html>
