<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Tugas - E-Office SKSDA</title>

  <!-- ===== Stylesheet ===== -->
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <link rel="stylesheet" href="../../assets/css/layout-ks.css" />
  <link rel="stylesheet" href="../../assets/css/pages/ks-tugas.css" />
</head>
<body>

  <!-- ===== Layout bersama (dirender via JS) ===== -->
  <aside id="ks-sidebar"></aside>
  <header id="ks-navbar"></header>

  <!-- ===== Konten halaman ===== -->
  <main class="main-content">

    <!-- ===== 1. HEADER ===== -->
    <nav class="dt-breadcrumb" aria-label="Breadcrumb">
      <a href="tugas-seksi.html">Tugas Seksi</a>
      <span class="dt-breadcrumb-sep" aria-hidden="true">&gt;</span>
      <span class="dt-breadcrumb-current" id="dt-kode">Detail Tugas</span>
    </nav>

    <section class="dt-head">
      <h1 class="dt-title" id="dt-judul">Memuat tugas...</h1>
      <div class="dt-head-actions">
        <button type="button" class="ktg-btn ktg-btn--outline" id="btn-edit">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.828 2.828 0 0 1 3 3L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
          Edit Detail
        </button>
        <button type="button" class="ktg-btn ktg-btn--green" id="btn-review">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          Review Hasil Tugas
        </button>
      </div>
    </section>

    <!-- ===== 2. GRID ===== -->
    <section class="dt-grid">

      <!-- ===== KIRI ===== -->
      <div class="dt-left">

        <!-- Deskripsi tugas -->
        <div class="dt-card">
          <div class="dt-card-head">
            <div class="dt-card-head-left">
              <span class="dt-card-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
              </span>
              <h2 class="dt-card-title">Deskripsi Tugas</h2>
            </div>
            <span class="ktg-badge ktg-badge--amber" id="dt-status">Menunggu Review</span>
          </div>
          <div id="dt-deskripsi"></div>
        </div>

        <!-- Checklist pekerjaan -->
        <div class="dt-card">
          <div class="dt-card-head">
            <div class="dt-card-head-left">
              <span class="dt-card-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
              </span>
              <h2 class="dt-card-title">Checklist Pekerjaan</h2>
            </div>
            <span class="dt-counter" id="dt-check-counter">0/0 Selesai</span>
          </div>
          <div id="dt-checklist"></div>
        </div>

        <!-- Lampiran hasil -->
        <div class="dt-card">
          <div class="dt-card-head">
            <div class="dt-card-head-left">
              <span class="dt-card-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
              </span>
              <h2 class="dt-card-title">Lampiran Hasil</h2>
            </div>
          </div>
          <div class="dt-file-grid" id="dt-lampiran"></div>
        </div>
      </div>

      <!-- ===== KANAN ===== -->
      <div class="dt-right">

        <!-- Informasi tugas -->
        <div class="dt-card">
          <div class="dt-card-head">
            <h2 class="dt-card-title">Informasi Tugas</h2>
          </div>
          <div id="dt-info"></div>
        </div>

        <!-- Aktivitas terbaru -->
        <div class="dt-card">
          <div class="dt-card-head">
            <h2 class="dt-card-title">Aktivitas Terbaru</h2>
          </div>
          <div class="dt-timeline" id="dt-aktivitas"></div>
        </div>
      </div>

    </section>

  </main>

  <!-- ===== Footer ===== -->
  <footer class="ks-footer">
    &copy; 2024 e-Office BKSDA Jawa Tengah. All rights reserved.
  </footer>

  <!-- ===== Skrip ===== -->
  <script type="module" src="../../assets/js/auth.js"></script>
  <script type="module" src="../../assets/js/components/sidebar-ks.js"></script>
  <script type="module" src="../../assets/js/components/navbar-ks.js"></script>
  <script type="module" src="../../assets/js/pages/detail-tugas.js"></script>
</body>
</html>
