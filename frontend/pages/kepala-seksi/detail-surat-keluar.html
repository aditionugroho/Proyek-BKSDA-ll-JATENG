<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Surat Keluar - E-Office SKSDA</title>

  <!-- ===== Stylesheet ===== -->
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/base.css" />
  <link rel="stylesheet" href="../../assets/css/layout-ks.css" />
  <link rel="stylesheet" href="../../assets/css/pages/detail-generic.css" />
</head>
<body>

  <!-- ===== Layout bersama ===== -->
  <aside id="ks-sidebar"></aside>
  <header id="ks-navbar"></header>

  <!-- ===== Konten ===== -->
  <main class="main-content">

    <nav class="dg-breadcrumb" aria-label="Breadcrumb">
      <a href="dashboard.html">Dashboard</a>
      <span class="dg-breadcrumb-sep">&gt;</span>
      <a href="surat-keluar.html">Surat Keluar</a>
      <span class="dg-breadcrumb-sep">&gt;</span>
      <span class="dg-breadcrumb-current" id="dg-crumb">Detail Surat Keluar</span>
    </nav>

    <a href="surat-keluar.html" class="dg-back">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Kembali ke Daftar Surat Keluar
    </a>

    <section class="dg-card">
      <div class="dg-title-row">
        <div>
          <h1 class="dg-title" id="dg-title">Memuat...</h1>
          <p class="dg-sub" id="dg-sub"></p>
        </div>
        <span class="dg-badge" id="dg-badge"></span>
      </div>
      <div class="dg-grid" id="dg-info"></div>
    </section>

  </main>

  <footer class="ks-footer">&copy; 2026 e-Office SKSDA Jawa Tengah. All rights reserved.</footer>

  <!-- ===== Skrip ===== -->
  <script type="module" src="../../assets/js/auth.js"></script>
  <script type="module" src="../../assets/js/components/sidebar-ks.js"></script>
  <script type="module" src="../../assets/js/components/navbar-ks.js"></script>
  <script type="module">
    import { SURAT_KELUAR } from "../../assets/js/data/surat-keluar.js";

    const id = Number(new URLSearchParams(location.search).get("id"));
    const d = SURAT_KELUAR.find((x) => x.id === id) || SURAT_KELUAR[0];

    document.getElementById("dg-crumb").textContent = d.nomor;
    document.getElementById("dg-title").textContent = d.perihal;
    document.getElementById("dg-sub").textContent = `${d.pengirim} (${d.pengirimSub}) \u2022 ${d.tanggal}`;

    const TONE = { red: "red", blue: "blue", amber: "amber", gray: "gray", solid: "blue", "outline-green": "green" };
    const badge = document.getElementById("dg-badge");
    badge.textContent = d.status.text;
    badge.className = `dg-badge dg-badge--${TONE[d.status.tone] || "gray"}`;

    const rows = [
      ["Nomor Surat", d.nomor, true],
      ["Penerima / Tujuan", `${d.pengirim} (${d.pengirimSub})`],
      ["Tanggal", d.tanggal],
      ["Prioritas", d.prioritas.text],
      ["Status", d.status.text]
    ];

    document.getElementById("dg-info").innerHTML = rows
      .map(([l, v, mono]) => `
        <div class="dg-field">
          <p class="dg-label">${l}</p>
          <p class="dg-value${mono ? " dg-value--mono" : ""}">${v}</p>
        </div>`)
      .join("");

    document.title = `${d.perihal} - E-Office SKSDA`;
  </script>
</body>
</html>
