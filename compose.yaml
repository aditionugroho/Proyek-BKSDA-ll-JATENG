services:
  sksda-mariadb:
    image: mariadb:11.4
    container_name: sksda-mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: eoffice_bksda
      MARIADB_USER: eoffice_user
      MARIADB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - sksda_mysql_data:/var/lib/mysql

volumes:
  sksda_mysql_data:
